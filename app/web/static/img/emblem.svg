<svg width="120" height="140" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="University of Jordan AI emblem">
  <defs>
    <linearGradient id="shield" x1="60" y1="6" x2="60" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16A85C"/>
      <stop offset="0.55" stop-color="#0E7C42"/>
      <stop offset="1" stop-color="#0A5630"/>
    </linearGradient>
    <linearGradient id="flame" x1="60" y1="18" x2="60" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A4D"/>
      <stop offset="1" stop-color="#D6101A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield -->
  <path d="M22 14 H98 Q106 14 106 24 Q106 84 60 132 Q14 84 14 24 Q14 14 22 14 Z"
        fill="url(#shield)" stroke="#08381F" stroke-width="3"/>
  <path d="M22 14 H98 Q106 14 106 24 Q106 84 60 132 Q14 84 14 24 Q14 14 22 14 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.4"
        transform="translate(0 2) scale(0.965)" transform-origin="60 70"/>

  <!-- AI neural nodes (subtle, woven into the field) -->
  <g stroke="#BFF3D6" stroke-opacity="0.5" stroke-width="1">
    <line x1="34" y1="40" x2="50" y2="60"/>
    <line x1="86" y1="40" x2="70" y2="60"/>
    <line x1="50" y1="60" x2="70" y2="60"/>
    <line x1="34" y1="40" x2="60" y2="30"/>
    <line x1="86" y1="40" x2="60" y2="30"/>
  </g>
  <g fill="#DFFBEC" fill-opacity="0.85">
    <circle cx="34" cy="40" r="2.4"/>
    <circle cx="86" cy="40" r="2.4"/>
    <circle cx="50" cy="60" r="2"/>
    <circle cx="70" cy="60" r="2"/>
  </g>

  <!-- Torch flame -->
  <g filter="url(#glow)">
    <path d="M60 18 C72 30 75 40 60 54 C45 40 48 30 60 18 Z" fill="url(#flame)"/>
    <path d="M60 28 C66 34 67 40 60 48 C53 40 54 34 60 28 Z" fill="#FFD7C2" fill-opacity="0.7"/>
  </g>

  <!-- Open book -->
  <g>
    <path d="M60 96 C50 88 38 88 28 92 L28 110 C38 106 50 106 60 112 Z"
          fill="#FFFFFF" stroke="#08381F" stroke-width="1.6"/>
    <path d="M60 96 C70 88 82 88 92 92 L92 110 C82 106 70 106 60 112 Z"
          fill="#FFFFFF" stroke="#08381F" stroke-width="1.6"/>
    <g stroke="#0E7C42" stroke-width="1.1" stroke-opacity="0.7">
      <line x1="34" y1="96" x2="54" y2="99"/>
      <line x1="34" y1="101" x2="54" y2="104"/>
      <line x1="66" y1="99" x2="86" y2="96"/>
      <line x1="66" y1="104" x2="86" y2="101"/>
    </g>
  </g>
</svg>
